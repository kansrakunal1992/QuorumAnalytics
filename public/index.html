<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quorum usage</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand">Quorum <span>usage</span></div>
  <div class="seg" role="group" aria-label="Time window" id="seg">
    <button data-days="7" aria-pressed="false">7 days</button>
    <button data-days="30" aria-pressed="true">30 days</button>
    <button data-days="90" aria-pressed="false">90 days</button>
  </div>
  <button class="btn" id="refresh" type="button">Refresh</button>
  <span class="stamp" id="stamp" aria-live="polite"></span>
  <a class="btn" href="/logout">Sign out</a>
</div></header>
<main id="app"><p class="skel">Loading numbers…</p></main>
<div class="tip" id="tip" role="tooltip"></div>
<script src="/assets/app.js"></script>
</body>
</html>
